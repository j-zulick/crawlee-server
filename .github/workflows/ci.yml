name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci --ignore-scripts
      - name: Syntax check
        run: node --check src/*.mjs
      - name: Tests (offline fixture site and fake Firecrawl; no internet)
        run: node --test --test-reporter=spec test/*.test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (runs the test suite inside the image build)
        uses: docker/build-push-action@v7
        with: { context: ., push: false, tags: "crawlee-server:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
