# Example deployment. Create the token first:  umask 077; openssl rand -hex 32 > crawl.token
services:
  crawlee-server:
    image: ghcr.io/j-zulick/crawlee-server:${CRAWLEE_SERVER_VERSION:-2.2.0}
    container_name: crawlee-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8794:8794"
    environment:
      CRAWL_TOKEN_FILE: /run/secrets/crawl.token
      CRAWL_MAX_PAGES: "300"
      CRAWL_MAX_CONCURRENCY: "5"
      CRAWL_MAX_SECONDS: "150"
      # Firecrawl (optional): rendering for JavaScript-heavy or blocked pages.
      FIRECRAWL_URL: ${FIRECRAWL_URL:-}
      FIRECRAWL_API_KEY_FILE: ${FIRECRAWL_API_KEY_FILE:-}
      # Page captures (opt-in per request with "capture": true). Stored in the volume below.
      CRAWL_CAPTURE_DIR: /var/lib/crawlee-captures
      CRAWL_CAPTURE_DEFAULT: "false"
      CRAWL_CAPTURE_MAX_BYTES: "5000000"
      CRAWL_CAPTURE_MAX_TOTAL_BYTES: "1073741824"
      CRAWL_CAPTURE_TTL_DAYS: "30"
      CRAWL_CAPTURE_READS_PER_MIN: "60"
    volumes:
      - ./crawl.token:/run/secrets/crawl.token:ro
      # - ./firecrawl.key:/run/secrets/firecrawl.key:ro
      # The only writable path besides /tmp. Holds raw third-party page content: keep it private, never commit it.
      - crawlee-captures:/var/lib/crawlee-captures
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  crawlee-captures:
